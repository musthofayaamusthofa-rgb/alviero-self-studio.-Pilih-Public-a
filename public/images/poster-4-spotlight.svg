<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-spot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <style>
      .hdr-self { font-family: 'Arial Black', sans-serif; fill: #FFFFFF; font-size: 42px; font-weight: 900; }
      .hdr-colour { font-family: 'Arial Black', sans-serif; fill: none; stroke: #FF80BF; stroke-width: 3; font-size: 50px; font-weight: 900; }
      .card-purple { fill: #2E1065; opacity: 0.9; rx: 20; }
      .card-dark { fill: #1E1B4B; opacity: 0.95; rx: 20; }
      .badge-pink { fill: #9D174D; rx: 30; }
      .badge-purple { fill: #581C87; rx: 30; }
      .text-bold { font-family: 'Arial', sans-serif; font-weight: bold; fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="1130" fill="url(#grad-spot)"/>

  <!-- Header -->
  <g text-anchor="middle" transform="translate(400, 75)">
    <text class="hdr-self">SELF</text>
    <text y="50" class="hdr-colour">COLOUR SPOTLIGHT</text>
  </g>

  <!-- Card 1: SPECIAL COLOUR SPOTLIGHT (99K) -->
  <g transform="translate(50, 160)">
    <rect x="180" y="30" width="520" height="200" class="card-purple"/>
    <rect x="520" y="0" width="120" height="60" class="badge-pink"/>
    <text x="580" y="40" fill="#FFFFFF" font-size="28" font-weight="900" text-anchor="middle">99K</text>
    <text x="440" y="60" fill="#FFFFFF" font-size="18" font-weight="900" text-anchor="middle">SPECIAL COLOUR SPOTLIGHT</text>
    <text x="440" y="80" fill="#F472B6" font-size="12" font-weight="bold" text-anchor="middle">(WAJIB MENGIKUTI SYARAT DAN KETENTUAN)</text>

    <g font-size="15" text-anchor="middle" class="text-bold">
      <text x="440" y="112">Maksimal 5 orang, Lebih dari 5 +15k/orang</text>
      <text x="440" y="134">Unlimited shoots</text>
      <text x="440" y="156" fill="#FF4D4D">Durasi 20 menit/sesi foto</text>
      <text x="440" y="178" fill="#FF4D4D">Free cetak 2 polaroid</text>
      <text x="440" y="200">1 Background • Available fun props • All file Google Drive</text>
    </g>

    <!-- Circle Spotlight Image Preview -->
    <g transform="translate(10, 10)">
      <circle cx="100" cy="110" r="95" fill="#111827"/>
      <circle cx="100" cy="110" r="75" fill="#3B82F6" opacity="0.6"/>
      <circle cx="85" cy="100" r="25" fill="#FBCFE8"/>
      <circle cx="115" cy="100" r="25" fill="#FBCFE8"/>
    </g>
  </g>

  <!-- Card 2: NORMAL COLOUR SPOTLIGHT (115K) -->
  <g transform="translate(50, 420)">
    <rect x="50" y="30" width="520" height="200" class="card-dark"/>
    <rect x="80" y="0" width="120" height="60" class="badge-purple"/>
    <text x="140" y="40" fill="#FFFFFF" font-size="28" font-weight="900" text-anchor="middle">115K</text>
    <text x="310" y="70" fill="#FFFFFF" font-size="20" font-weight="900" text-anchor="middle">NORMAL COLOUR SPOTLIGHT</text>

    <g font-size="15" text-anchor="middle" class="text-bold">
      <text x="310" y="105">Maksimal 5 orang, Lebih dari 5 +15k/orang</text>
      <text x="310" y="128">Unlimited shoots</text>
      <text x="310" y="151" fill="#FF4D4D">Durasi 20 menit/sesi foto</text>
      <text x="310" y="174" fill="#FF4D4D">Free cetak 2 polaroid</text>
      <text x="310" y="197">1 Background • Available fun props • All file Google Drive</text>
    </g>

    <!-- Arch Spotlight Image Preview -->
    <g transform="translate(500, 10)">
      <path d="M 0,90 A 90,90 0 0 1 180,90 L 180,210 L 0,210 Z" fill="#1E1B4B" stroke="#06B6D4" stroke-width="4"/>
      <path d="M 10,95 A 80,80 0 0 1 170,95 L 170,205 L 10,205 Z" fill="#10B981" opacity="0.8"/>
    </g>
  </g>

  <!-- Bottom Section: Polaroid Samples -->
  <g transform="translate(30, 690)">
    <!-- Polaroid 1 -->
    <g transform="translate(0, 50) rotate(-8)">
      <rect width="170" height="210" fill="#FFFFFF" rx="4"/>
      <rect x="10" y="10" width="150" height="150" fill="#0284C7"/>
      <circle cx="85" cy="85" r="55" fill="#38BDF8"/>
    </g>

    <!-- Polaroid 2 -->
    <g transform="translate(180, 20) rotate(-4)">
      <rect width="170" height="210" fill="#FFFFFF" rx="4"/>
      <rect x="10" y="10" width="150" height="150" fill="#0F172A"/>
      <circle cx="85" cy="85" r="55" fill="#E2E8F0"/>
    </g>

    <!-- Polaroid 3 -->
    <g transform="translate(360, 40) rotate(4)">
      <rect width="170" height="210" fill="#FFFFFF" rx="4"/>
      <rect x="10" y="10" width="150" height="150" fill="#C026D3"/>
      <circle cx="85" cy="85" r="55" fill="#F472B6"/>
    </g>

    <!-- Polaroid 4 -->
    <g transform="translate(540, 10) rotate(8)">
      <rect width="170" height="210" fill="#FFFFFF" rx="4"/>
      <rect x="10" y="10" width="150" height="150" fill="#09090B"/>
      <circle cx="85" cy="85" r="55" fill="#27272A"/>
    </g>
  </g>

  <!-- Footer -->
  <text x="400" y="1090" fill="#818CF8" font-size="22" font-weight="900" text-anchor="middle">FEEL FREE TO COLOURING YOUR STYLE</text>
</svg>
