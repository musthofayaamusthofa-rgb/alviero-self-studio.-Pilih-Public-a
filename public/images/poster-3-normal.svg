<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="100%" height="100%">
  <defs>
    <style>
      .hdr-sub { font-family: 'Arial Black', sans-serif; fill: #4A3333; font-size: 38px; }
      .hdr-main { font-family: 'Arial Black', sans-serif; font-size: 52px; font-weight: 900; }
      .hdr-note { font-family: 'Arial', sans-serif; fill: #111111; font-size: 20px; font-weight: bold; }
      .card-bg { fill: #A38484; opacity: 0.85; rx: 20; }
      .badge-bg { fill: #6B5252; rx: 30; }
      .text-bold { font-family: 'Arial', sans-serif; font-weight: bold; }
      .text-red { fill: #E63946; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="1130" fill="#D4BABA"/>

  <!-- Header Text -->
  <g text-anchor="middle" transform="translate(400, 70)">
    <text class="hdr-sub">SELF STUDIO</text>
    <text y="50" class="hdr-main">
      <tspan fill="#E63946">NORMAL </tspan>
      <tspan fill="#332222">PRICE LIST</tspan>
    </text>
    <text y="85" class="hdr-note">(TANPA SYARAT DAN KETENTUAN)</text>
  </g>

  <!-- Card 1: NORMAL NARSIS (80K) -->
  <g transform="translate(50, 180)">
    <rect x="180" y="30" width="520" height="180" class="card-bg"/>
    <rect x="520" y="0" width="120" height="60" class="badge-bg"/>
    <text x="580" y="40" fill="#FFFFFF" font-size="28" font-weight="900" text-anchor="middle">80K</text>
    <text x="380" y="70" fill="#FFFFFF" font-size="22" font-weight="900" text-anchor="middle">NORMAL NARSIS</text>

    <!-- Specs text -->
    <g fill="#FFFFFF" font-size="16" text-anchor="middle" class="text-bold">
      <text x="440" y="105">Maksimal 5 orang Lebih dari 5 +15k/orang</text>
      <text x="440" y="128">Unlimited shoots</text>
      <text x="440" y="151" fill="#FF4D4D">Durasi 15 menit/sesi foto</text>
      <text x="440" y="174" fill="#FF4D4D">Free cetak 2 polaroid</text>
      <text x="440" y="197">1 Background • Available fun props • All file Google Drive</text>
    </g>

    <!-- Photo Arch -->
    <g transform="translate(20, 0)">
      <path d="M 0,100 A 90,90 0 0 1 180,100 L 180,220 L 0,220 Z" fill="#8C7070" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="90" cy="90" r="30" fill="#FFE5D9"/>
      <circle cx="50" cy="130" r="25" fill="#FFE5D9"/>
      <circle cx="130" cy="130" r="25" fill="#FFE5D9"/>
    </g>
  </g>

  <!-- Card 2: NORMAL SUPER NARSIS (95K) -->
  <g transform="translate(50, 440)">
    <rect x="50" y="30" width="520" height="180" class="card-bg"/>
    <rect x="100" y="0" width="120" height="60" class="badge-bg"/>
    <text x="160" y="40" fill="#FFFFFF" font-size="28" font-weight="900" text-anchor="middle">95K</text>
    <text x="310" y="70" fill="#FFFFFF" font-size="22" font-weight="900" text-anchor="middle">NORMAL SUPER NARSIS</text>

    <!-- Specs text -->
    <g fill="#FFFFFF" font-size="16" text-anchor="middle" class="text-bold">
      <text x="310" y="105">Maksimal 5 orang Lebih dari 5 +15k/orang</text>
      <text x="310" y="128">Unlimited shoots</text>
      <text x="310" y="151" fill="#FF4D4D">Durasi 20 menit/sesi foto</text>
      <text x="310" y="174" fill="#FF4D4D">Free cetak 2 polaroid</text>
      <text x="310" y="197">1 Background • Available fun props • All file Google Drive</text>
    </g>

    <!-- Photo Arch Right -->
    <g transform="translate(500, 0)">
      <path d="M 0,100 A 90,90 0 0 1 180,100 L 180,220 L 0,220 Z" fill="#8C7070" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="70" cy="110" r="28" fill="#FFE5D9"/>
      <circle cx="120" cy="110" r="28" fill="#FFE5D9"/>
    </g>
  </g>

  <!-- Section 3: ADDITIONAL -->
  <g transform="translate(80, 710)">
    <rect width="640" height="320" rx="30" fill="#A88B8B" opacity="0.9"/>
    <rect x="230" y="-25" width="180" height="55" rx="20" fill="#6B5252"/>
    <text x="320" y="10" fill="#FFFFFF" font-size="22" font-weight="900" text-anchor="middle">ADDITIONAL</text>

    <g fill="#FFFFFF" font-size="18" text-anchor="middle" class="text-bold" transform="translate(320, 70)">
      <text y="0">+ Waktu 20K/5 menit</text>
      <text y="32">+ Cetak 7.5K/1 lembar foto</text>
      <text y="64">+ Cetak 8K/2 lembar (GRID 3)</text>
      <text y="96">+ Hewan Peliharaan selain Anjing (dari client) 25K</text>
      <text y="128">+ Orang 15K/orang</text>
      <text y="160">+ Sewa Kostum Dino 15K/orang (Sepasang 25K)</text>
      <text y="192">+ Spotlight 25K (Khusus Background Tirai Coklat)</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="400" y="1090" fill="#4A3333" font-size="22" font-weight="900" text-anchor="middle">FEEL FREE TO EXPRESS YOUR STYLE</text>
</svg>
